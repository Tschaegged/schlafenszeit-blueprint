blueprint:
  name: Schlafenszeit per RFID-Tag
  source_url: https://github.com/Tschaegged/schlafenszeit-blueprint/blob/main/blueprints/automation/schlafenszeit_rfid.yaml
  description: |
    # 🛏️ Schlafenszeit per RFID-Tag

    Scannt man beim Zubettgehen einen RFID/NFC-Tag, werden automatisch:
    - ausgewählte **Lichter, Gruppen und Schalter ausgeschaltet**
    - ausgewählte **Heizzonen in den Eco-Modus gezwungen**
    - ausgewählte **Rollläden vollständig geschlossen**

    Leere Auswahlen werden einfach übersprungen, es entsteht kein Fehler.

    ### 💡 Gemischte Auswahl

    Beim Ausschalten sind neben Lichtern auch **Gruppen** (`group.…`) und **Schalter**
    (`switch.…`) erlaubt. So lässt sich eine einzige Sammelgruppe hinterlegen, die
    Lampen *und* lampensteuernde Steckdosen enthält – bei gemischten Gruppen ist das
    der einzige Weg, denn ein UI-Gruppen-Helfer kann immer nur eine Domain abdecken.

    ### 🌱 Voraussetzung für den Eco-Modus

    Dieses Blueprint schaltet **keine Climate-Entitäten direkt**. Die Heizzonen-Automationen
    (`panhans/advanced_heating_control.yaml`, z. B. `Heizung_Schlafzimmer_v5`) kennen keinen
    `climate.set_preset_mode`, sondern erzwingen Eco über einen eigenen `input_boolean`-Helfer
    im Input `input_force_eco_temperature`. Lege pro gewünschter Heizzone einen solchen Helfer
    an, hinterlege ihn in der jeweiligen Heizungs-Automation und wähle hier genau diese Helfer
    aus. Das Blueprint schaltet sie per `input_boolean.turn_on` ein; die Priorität von Force-Eco
    ist hoch (nur der Party-Modus steht darüber).

    ### ⏰ Automatische Eco-Freigabe am Morgen

    Zur eingestellten Uhrzeit schaltet das Blueprint **alle** oben gewählten Eco-Helfer wieder
    aus – egal wie viele Heizzonen eingetragen sind. Danach gelten wieder die normalen
    Heizpläne. Ohne diese Freigabe bliebe Force-Eco dauerhaft aktiv und kein Raum käme mehr
    auf Komforttemperatur. Wähle eine Zeit kurz vor dem frühesten Heizbeginn aller Zonen.
    Lief Home Assistant zur Freigabezeit nicht (Neustart, Update), wird die Freigabe beim
    nächsten Start nachgeholt, sofern der letzte Tag-Scan vor der verpassten Freigabe lag.
  domain: automation
  author: Claude
  homeassistant:
    min_version: "2024.10.0"

  input:
    tag_id:
      name: "🏷️ RFID/NFC-Tag"
      description: >-
        Die Tag-ID, deren Scan die Schlafenszeit-Routine auslöst. Zu finden unter
        Einstellungen → Automationen & Szenen → Tags, oder beim Anlegen eines
        Tag-Triggers in der Automations-UI.
      selector:
        text: {}
    lights:
      name: "💡 Lichter, Gruppen & Schalter"
      description: >-
        `optional`


        Wird beim Scan ausgeschaltet. Neben einzelnen Lichtern sind auch **Gruppen**
        (`group.…`) und **Schalter** (`switch.…`) erlaubt – praktisch für Lampen, die
        an einer Steckdose hängen, oder für eine Sammelgruppe „alle Lampen".


        Ausgeschaltet wird über `homeassistant.turn_off`. Das schaltet jede Domain
        korrekt ab – anders als `light.turn_off`, das bei einer gemischten Gruppe die
        Schalter-Mitglieder stillschweigend überspringen würde.
      default: []
      selector:
        entity:
          multiple: true
          filter:
          - domain:
            - light
          - domain:
            - switch
          - domain:
            - group
    climate_eco_helpers:
      name: "🌱 Heizungen (Eco erzwingen)"
      description: >-
        `optional`

        Force-Eco-`input_boolean`-Helfer der gewünschten Heizzonen-Automationen (siehe
        Beschreibung oben) – nicht die Climate-Entitäten selbst.
      default: []
      selector:
        entity:
          multiple: true
          filter:
          - domain:
            - input_boolean
    eco_release_time:
      name: "⏰ Eco freigeben um"
      description: >-
        Zu dieser Uhrzeit werden alle gewählten Eco-Helfer wieder ausgeschaltet, damit
        die Heizpläne wieder gelten. Am besten kurz vor dem frühesten Heizbeginn.
      default: "04:30:00"
      selector:
        time: {}
    covers:
      name: "🪟 Rollläden"
      description: "`optional`\n\nDiese Rollläden/Jalousien werden vollständig geschlossen."
      default: []
      selector:
        entity:
          multiple: true
          filter:
          - domain:
            - cover

variables:
  tag_id_value: !input tag_id
  eco_helpers: !input climate_eco_helpers
  release_time: !input eco_release_time

triggers:
  - trigger: tag
    tag_id: !input tag_id
    id: tag_scan
  - trigger: time
    at: !input eco_release_time
    id: eco_freigabe
  - trigger: homeassistant
    event: start
    id: neustart

conditions: []

actions:
  - choose:
      # ── Tag gescannt: Schlafenszeit ──────────────────────────────────────
      - conditions:
          - condition: trigger
            id: tag_scan
        sequence:
          # homeassistant.turn_off statt light.turn_off: expandiert Gruppen ueber alle
          # Domains hinweg. light.turn_off wuerde eine gemischte group.* zwar annehmen,
          # danach aber auf die light-Mitglieder filtern - Steckdosen/Schalter in der
          # Gruppe blieben unbemerkt an.
          - action: homeassistant.turn_off
            target:
              entity_id: !input lights
          - action: input_boolean.turn_on
            target:
              entity_id: !input climate_eco_helpers
          - action: cover.close_cover
            target:
              entity_id: !input covers

      # ── Morgens: Eco fuer alle gewaehlten Heizzonen wieder freigeben ─────
      - conditions:
          - condition: trigger
            id: eco_freigabe
          - condition: template
            value_template: "{{ eco_helpers | count > 0 }}"
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: !input climate_eco_helpers

      # ── Nach Neustart: verpasste Freigabe nachholen ──────────────────────
      # Freigeben, wenn noch ein Eco-Helfer an ist und der letzte Tag-Scan vor
      # dem letzten Freigabezeitpunkt lag. Der Scan-Zeitpunkt kommt aus der
      # Tag-Entitaet (deren Zustand = letzter Scan); last_changed der Helfer
      # taugt dafuer nicht, weil ein Neustart ihn auf die Startzeit setzt.
      - conditions:
          - condition: trigger
            id: neustart
          - condition: template
            value_template: >-
              {% set freigabe = today_at(release_time) %}
              {% set letzte_freigabe = freigabe if now() >= freigabe
                 else freigabe - timedelta(days=1) %}
              {% set tag_entity = states.tag
                 | selectattr('attributes.tag_id', 'eq', tag_id_value)
                 | map(attribute='entity_id') | first | default(none) %}
              {% set letzter_scan = as_datetime(states(tag_entity), none) if tag_entity else none %}
              {{ eco_helpers | select('is_state', 'on') | list | count > 0
                 and (letzter_scan is none or letzter_scan < letzte_freigabe) }}
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: !input climate_eco_helpers

mode: single
